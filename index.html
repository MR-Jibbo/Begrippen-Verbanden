<body>
  <div id="__bundler_placeholder">Loading Begrippenlijst animatie...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

my - CY) * 0.28;\n      const out = [];\n      for (let k = 0; k <= N; k++) {\n        const u = k / N, w = 1 - u;\n        out.push([w * w * p[0] + 2 * w * u * cx + u * u * q[0], w * w * p[1] + 2 * w * u * cy + u * u * q[1]]);\n      }\n      return out;\n    };\n    const hubs = nodes.slice(1).sort((p, q) => q.adj.length - p.adj.length || p.n - q.n).slice(0, 5);\n    const W = { nodes, edges, stories: WD.s, TY, CX, CY, RR, LW, pos, ang, bez, hubs, nDer: edges.filter((e) => e.d).length };\n    Ctor._W = W;\n    return W;\n  }\n\n  _webVals(v, s) {\n    const E = this._engine(), W = this._web(), C = E.C, f = E.f;\n    const o = E.mk();\n    v.wq = s.wq || ''; v.wHasQ = !!(s.wq && s.wq.length);\n    v.onWQ = (e) => this.setState({ wq: (e && e.target && e.target.value) || '' });\n    v.onWClear = () => this.setState({ wq: '' });\n    v.onWKey = (e) => {\n      if (!e) return;\n      if (e.key === 'Escape') this.setState({ wq: '' });\n      else if (e.key === 'Enter') { const r = this._searchFirst(this.state && this.state.wq); if (r) this._pick(r); }\n    };\n    const sel = s.sel || 0;\n    const st = s.story == null ? -1 : s.story;\n    const step = s.step || 0;\n    const story = st >= 0 ? W.stories[st] : null;\n    const other = (e, n) => (e.a === n ? e.b : e.a);\n    const phrase = (e, from) => (e.a === from ? e.rel : e.rev);\n\n    /* wat is zichtbaar/actief */\n    const nodeState = new Array(93).fill(0); // 0 neutraal, 1 actief, 2 gekozen\n    const edgeState = new Array(W.edges.length).fill(0); // 0 neutraal, 1 gedimd, 2 actief, 3 focus\n    let mode = 'idle';\n    let focusE = -1;\n    if (story) {\n      mode = 'story';\n      edgeState.fill(1);\n      story.n.slice(0, step + 1).forEach((n) => { nodeState[n] = 1; });\n      story.s.slice(0, step).forEach((x) => { edgeState[x[0]] = 2; });\n      if (step >= 1) { focusE = story.s[step - 1][0]; edgeState[focusE] = 3; nodeState[story.s[step - 1][2]] = 2; }\n      else nodeState[story.n[0]] = 2;\n    } else if (s    const norm = (x) => String(x || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');\n    const qn = norm(q).trim();\n    if (!qn) return 0;\n    const words = qn.split(/\\s+/);\n    let best = 0, bs = 99;\n    for (let i = 1; i <= 92; i++) {\n      const nd = W.nodes[i];\n      const nm = norm(nd.name), hay = norm(nd.name + ' ' + nd.sub + ' ' + nd.short), hd = norm(nd.def);\n      if (!words.every((w) => hay.includes(w) || hd.includes(w))) continue;\n      const inName = words.every((w) => hay.includes(w));\n      const sc = !inName ? 4 : nm.startsWith(qn) ? 0 : 1;\n      if (sc < bs) { bs = sc; best = i; }\n    }\n    return best;\n  }\n\n  _toetsVals(v, s) {\n    const W = this._web();\n    const TD = {\"cases\":[{\"title\":\"Casus 1 – Ørsted en Hornsea 4\",\"short\":\"Ørsted\",\"segs\":[{\"t\":\"Het Deense energiebedrijf Ørsted bouwt en beheert windparken op zee. In het Britse Hornsea-gebied draaien Hornsea 1 en 2 al. In september 2024 kreeg Ørsted een contract voor Hornsea 4: een \",\"h\":-1},{\"t\":\"windpark van 2.400 megawatt dat vóór eind 2030 in gebruik moest zijn\",\"h\":0},{\"t\":\". \",\"h\":-1},{\"t\":\"Bij het project horen ook kabels naar land en installaties voor de aansluiting op het elektriciteitsnet.\",\"h\":1},{\"t\":\"\",\"h\":-2},{\"t\":\"Het contract viel onder de Britse regeling Contracts for Difference.\",\"h\":2},{\"t\":\" Daarbij wordt vooraf een vaste prijs voor de stroom afgesproken. Ligt de marktprijs lager, dan krijgt de producent een aanvulling; ligt die hoger, dan betaalt de producent het verschil terug. \",\"h\":-1},{\"t\":\"Zo krijgen investeerders zekerheid over hun inkomsten.\",\"h\":3},{\"t\":\"\",\"h\":-2},{\"t\":\"Ørsted is beursgenoteerd.\",\"h\":4},{\"t\":\" In oktober 2024 \",\"h\":-1},{\"t\":\"verkocht het kleine belangen in vier bestaande windparken, waaronder Hornsea 1 en 2, aan investeerder Brookfield voor ongeveer 1,7 miljard pond\",\"h\":5},{\"t\":\". Ørsted bleef de parken beheren. \",\"h\":-1},{\"t\":\"Volgens het bedrijf maakte de verkoop geld vrij om in nieuwe projecten te investeren.\",\"h\":6},{\"t\":\"\",\"h\":-2},{\"t\":\"In december 2024 publiceerde \",\"h\":-1},{\"t\":\"de Britse regering het plan Clean Power 2030\",\"h\":7},{\"t\":\". In 2030 moet \",\"h\":-1},{\"t\":\"ten minste 95 procent van de stroom uit schone bronnen komen\",\"h\":8},{\"t\":\". Daarvoor wil de regering \",\"h\":-1},{\"t\":\"meer wind- en zonne-energie, sterkere elektriciteitsnetten, meer opslag en flexibeler stroomgebruik\",\"h\":9},{\"t\":\". \",\"h\":-1},{\"t\":\"Het net is een knelpunt: de wachtrij voor nieuwe netaansluitingen was in vijf jaar ongeveer tien keer zo groot geworden.\",\"h\":10},{\"t\":\"\",\"h\":-2},{\"t\":\"Tegelijk wil de regering ongeveer 35 gigawatt aan gascentrales als reserve beschikbaar houden\",\"h\":11},{\"t\":\", voor momenten met veel vraag en weinig wind en zon. De overheid stelde voor om eigenaren van oudere gascentrales meerjarige afspraken over hun beschikbaarheid te geven. \",\"h\":-1},{\"t\":\"Dat geeft hen zekerheid over inkomsten en maakt investeringen mogelijk om die centrales langer open te houden.\",\"h\":12},{\"t\":\" \",\"h\":-1},{\"t\":\"Nieuwe centrales moeten later kunnen worden omgebouwd naar waterstof of CO₂-afvang.\",\"h\":13},{\"t\":\"\",\"h\":-2},{\"t\":\"Op 7 mei 2025 maakte Ørsted bekend dat het Hornsea 4 niet bouwt onder het contract uit 2024.\",\"h\":14},{\"t\":\" \",\"h\":-1},{\"t\":\"De kosten van leveranciers en de rente waren gestegen en de risico's bij de uitvoering waren groter geworden.\",\"h\":15},{\"t\":\" Ørsted sloot niet uit dat het windpark later alsnog wordt gebouwd.\",\"h\":-1}],\"hl\":[{\"ts\":[{\"n\":38,\"l\":\"m\",\"w\":\"Een windpark heeft impact op klimaat en omgeving: dat is de inside-out kant van materialiteit.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":32,\"l\":\"h\",\"w\":\"Windpark, kabels en netaansluiting zijn fysieke middelen die het bedrijf inzet: geproduceerd kapitaal.\"}],\"q\":\"Welke van de zes kapitalen heeft Ørsted nodig om Hornsea 4 te bouwen? Noem er minstens twee.\",\"a\":\"Geproduceerd kapitaal (het windpark, de kabels en de netaansluiting) en financieel kapitaal (geld en investeerders, met de vaste prijs uit het contract als zekerheid). Daarnaast zijn menselijk kapitaal (kennis en vaardigheden van medewerkers), intellectueel kapitaal (expertise in wind op zee) en natuurlijk kapitaal (wind en zee) nodig.\",\"gen\":0},{\"ts\":[{\"n\":86,\"l\":\"h\",\"w\":\"Een overheidsregeling grijpt in op het niveau van wet- en regelgeving om investeren in wind aantrekkelijk te maken.\"}],\"q\":\"Wat voor type interventie is Contracts for Difference (ontwerp, organisatorisch of institutioneel)? Leg uit.\",\"a\":\"Een institutionele interventie: de overheid grijpt in via een regeling (wet- en regelgeving). De vaste prijs geeft investeerders zekerheid over hun inkomsten en maakt investeren in wind aantrekkelijker.\",\"gen\":0},{\"ts\":[{\"n\":78,\"l\":\"m\",\"w\":\"Zekere inkomsten sturen kapitaal naar windenergie in plaats van naar andere projecten.\"},{\"n\":31,\"l\":\"m\",\"w\":\"Het gaat om geldstromen en financiële zekerheid voor investeerders.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":79,\"l\":\"h\",\"w\":\"Bij een beursgenoteerd bedrijf wordt zeggenschap vooral gelegitimeerd door wie kapitaal en financieel risico inbrengt.\"},{\"n\":77,\"l\":\"m\",\"w\":\"Beurs en investeerders maken financiële indicatoren steeds bepalender voor de strategie.\"}],\"q\":\"Past Ørsted bij het aandeelhoudersmodel of het stakeholdersmodel? Onderbouw met de casus.\",\"a\":\"Vooral het aandeelhoudersmodel: Ørsted is beursgenoteerd, kapitaalverschaffers zoals Brookfield hebben grote invloed en de beslissing om Hornsea 4 niet te bouwen komt voort uit kosten, rente en risico. Kanttekening: het bedrijf bouwt wel voor een maatschappelijk doel (schone stroom), maar de zeggenschap en afweging lopen via kapitaal.\",\"gen\":0},{\"ts\":[{\"n\":31,\"l\":\"h\",\"w\":\"Door belangen te verkopen komen geldmiddelen vrij: financieel kapitaal.\"},{\"n\":30,\"l\":\"h\",\"w\":\"Ørsted zet geproduceerd kapitaal (parken) om in financieel kapitaal om te herinvesteren: een klassieke zes-kapitalenvraag.\"}],\"q\":\"Beschrijf met de zes kapitalen wat Ørsted doet met de verkoop aan Brookfield.\",\"a\":\"Ørsted zet een deel van zijn geproduceerd kapitaal (belangen in windparken) om in financieel kapitaal (ongeveer 1,7 miljard pond) en wil dat gebruiken om te investeren in nieuwe projecten, dus in nieuw geproduceerd kapitaal. Het beheer, en daarmee kennis en medewerkers (intellectueel en menselijk kapitaal), blijft bij Ørsted.\",\"gen\":0},{\"ts\":[{\"n\":78,\"l\":\"h\",\"w\":\"Kapitaalstromen bepalen welke projecten kunnen groeien en welke niet.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":86,\"l\":\"h\",\"w\":\"Overheidsbeleid dat het hele energiesysteem moet sturen: ingreep op het niveau van regelgeving en beleid.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":4,\"l\":\"m\",\"w\":\"Past bij de SDG's voor betaalbare en schone energie en klimaatactie.\"},{\"n\":29,\"l\":\"m\",\"w\":\"Minder uitstoot houdt de wereldwijde opwarming binnen het koolstofbudget.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":1,\"l\":\"h\",\"w\":\"Opwek, net, opslag en vraag hangen samen en moeten samen worden ontworpen: systeemdenken.\"},{\"n\":51,\"l\":\"m\",\"w\":\"Het vraagstuk als geheel bekijken in plaats van alleen windparken bouwen.\"}],\"q\":\"Waarom is alleen meer windparken bouwen niet genoeg? Gebruik systeemdenken.\",\"a\":\"Het energiesysteem bestaat uit opwek, net, opslag en vraag die samenhangen. Als één onderdeel stokt, zoals het net met zijn wachtrij van tien keer zo groot, remt dat het geheel. Systeemdenken kijkt naar die verbanden: je moet windparken, netten, opslag en flexibel gebruik samen ontwikkelen, anders verplaats je het probleem.\",\"gen\":0},{\"ts\":[{\"n\":65,\"l\":\"h\",\"w\":\"Netcapaciteit is een grens die bepaalt hoeveel er beschikbaar is en wie er toegang toe heeft.\"},{\"n\":53,\"l\":\"m\",\"w\":\"Het net uitbreiden of sneller aansluiten is een plek waar een kleine ingreep het hele systeem kan versnellen.\"},{\"n\":64,\"l\":\"m\",\"w\":\"Wie komt eerst aan de beurt in de wachtrij? Dat is een verdelingsvraag.\"}],\"q\":\"Welke grens (begrenzing) remt de energietransitie hier, en waar zit het hefboompunt?\",\"a\":\"De netcapaciteit: die bepaalt hoeveel nieuwe opwek er kan worden aangesloten en wie toegang krijgt (de wachtrij). Het hefboompunt is het net: sneller uitbreiden en slimmer aansluiten, plus flexibeler stroomgebruik, geeft een groot effect op het hele systeem.\",\"gen\":0},{\"ts\":[{\"n\":61,\"l\":\"h\",\"w\":\"Leveringszekerheid weegt tegen klimaatdoelen: elke keuze heeft eigen voor- en nadelen.\"},{\"n\":50,\"l\":\"m\",\"w\":\"Doelen botsen (betrouwbaar, betaalbaar, klimaatneutraal) en elke ingreep verandert het probleem.\"}],\"q\":\"Beschrijf de trade-off tussen gascentrales als reserve en de klimaatdoelen. Wie weegt wat?\",\"a\":\"Voor gascentrales: leveringszekerheid bij weinig wind en zon, en stabiliteit en betaalbaarheid voor gebruikers. Ertegen: CO₂-uitstoot en het doel van minstens 95 procent schone stroom. De regering weegt dit af, onder invloed van eigenaren van centrales (zekere inkomsten) en klimaatbelangen. Het antwoord hangt af van waarden: hoeveel zekerheid nu is het waard ten opzichte van snelheid in de transitie?\",\"gen\":0},{\"ts\":[{\"n\":55,\"l\":\"h\",\"w\":\"Investeren in oude gascentrales houdt het systeem vast aan fossiele infrastructuur.\"},{\"n\":56,\"l\":\"h\",\"w\":\"Eerdere keuzes beperken de ruimte voor latere keuzes: het systeem blijft op een onduurzaam pad.\"}],\"q\":\"Welk risico ontstaat als oude gascentrales langer open blijven? Gebruik lock-in of padafhankelijkheid.\",\"a\":\"Lock-in: investeringen en zekere inkomsten binden het systeem aan gas, waardoor overstappen moeilijker wordt. Padafhankelijkheid: eerdere keuzes beperken de ruimte voor latere keuzes, ook als er betere alternatieven zijn. Een risicobeperking is dat nieuwe centrales later kunnen worden omgebouwd (waterstof of CO₂-afvang).\",\"gen\":0},{\"ts\":[{\"n\":44,\"l\":\"m\",\"w\":\"Een ontwerp dat kan meebewegen als omstandigheden veranderen.\"},{\"n\":84,\"l\":\"m\",\"w\":\"Een ingreep in het ontwerp zelf (ombouwbaar) om lock-in te verkleinen.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":78,\"l\":\"h\",\"w\":\"Zonder rendabel financieringsplaatje krijgt zelfs een klimaatproject geen kapitaal.\"},{\"n\":3,\"l\":\"m\",\"w\":\"De planet-winst van het park weegt niet op tegen de profit-kant.\"}],\"q\":\"Welk mechanisme bepaalt hier of een duurzaam project doorgaat? Gebruik kapitaal als selectiemechanisme.\",\"a\":\"De stroom van investeringen bepaalt welke projecten toegang krijgen tot groei en schaal. Door hogere kosten, rente en risico is Hornsea 4 onder het contract niet rendabel genoeg, dus krijgt het geen kapitaal, ondanks het klimaatnut.\",\"gen\":0},{\"ts\":[{\"n\":39,\"l\":\"h\",\"w\":\"Externe ontwikkelingen (rente, leverancierskosten) raken de financiële positie van Ørsted: outside-in.\"},{\"n\":37,\"l\":\"h\",\"w\":\"Impact op de wereld (inside-out) en impact van de wereld op het bedrijf (outside-in) komen samen.\"},{\"n\":77,\"l\":\"m\",\"w\":\"Financiële omstandigheden bepalen de strategische keuzes.\"},{\"n\":81,\"l\":\"m\",\"w\":\"Rendementseisen en risicodrempels bepalen welke opties überhaupt haalbaar lijken.\"}],\"q\":\"Leg uit met dubbele materialiteit: wat is inside-out en wat is outside-in bij Hornsea 4?\",\"a\":\"Inside-out: de impact van Ørsted en het windpark op mens en milieu, zoals schone stroom en minder CO₂. Outside-in: hoe externe ontwikkelingen Ørsted raken, zoals stijgende rente, hogere leverancierskosten, uitvoeringsrisico's en beleid (Contracts for Difference, Clean Power 2030, de netwachtrij).\",\"gen\":0},{\"ts\":[{\"n\":58,\"l\":\"h\",\"w\":\"Ørsted, de Britse regering, Brookfield, leveranciers en stroomgebruikers: wie heeft belang bij of invloed op Hornsea 4?\"}],\"q\":\"Welke stakeholders spelen een rol en welke belangen hebben ze?\",\"a\":\"Ørsted (rendement en groei), de Britse regering (schone én betrouwbare stroom), Brookfield en andere investeerders (rendement en zekerheid), leveranciers (omzet), eigenaren van gascentrales (inkomsten) en stroomgebruikers (betaalbaar, betrouwbaar, schoon). De netbeheerder bepaalt via de netaansluiting mee wat mogelijk is.\",\"gen\":1},{\"ts\":[{\"n\":59,\"l\":\"h\",\"w\":\"Regering en investeerders hebben veel macht én belang, omwonenden en gebruikers minder macht: wie betrek je eerst?\"}],\"q\":\"\",\"a\":\"\",\"gen\":1}]},{\"title\":\"Casus 2 – Fairphone\",\"short\":\"Fairphone\",\"segs\":[{\"t\":\"Fairphone is een Nederlands bedrijf dat smartphones maakt. In juni 2025 \",\"h\":-1},{\"t\":\"bracht het zijn zesde generatie op de markt, voor 599 euro\",\"h\":0},{\"t\":\". \",\"h\":-1},{\"t\":\"Fairphone wil groeien en meer klanten bereiken.\",\"h\":1},{\"t\":\" De telefoon wordt daarom niet alleen via de eigen webshop verkocht, maar ook via winkels en telecomaanbieders zoals Coolblue en KPN.\",\"h\":-1},{\"t\":\"\",\"h\":-2},{\"t\":\"De telefoon is gemaakt om lang mee te gaan. Fairphone geeft vijf jaar garantie en belooft software-updates tot 2033.\",\"h\":2},{\"t\":\" \",\"h\":-1},{\"t\":\"Gebruikers kunnen twaalf onderdelen zelf vervangen met een schroevendraaier, waaronder de batterij, het scherm en de camera.\",\"h\":3},{\"t\":\" Een nieuwe batterij plaatsen kost volgens Fairphone vijf tot tien minuten. Wie niet zelf wil repareren, stuurt de telefoon naar een reparatiecentrum. \",\"h\":-1},{\"t\":\"Daarna kan de eigenaar kiezen: laten repareren, ongerepareerd terugkrijgen of laten recyclen.\",\"h\":4},{\"t\":\" \",\"h\":-1},{\"t\":\"Fairphone blijft intussen nieuwe telefoons verkopen.\",\"h\":5},{\"t\":\"\",\"h\":-2},{\"t\":\"Volgens Fairphone bestaat meer dan de helft van het gewicht van de telefoon uit eerlijk gewonnen of gerecyclede materialen, zoals goud, kobalt en aluminium.\",\"h\":6},{\"t\":\" \",\"h\":-1},{\"t\":\"De productieketen bestaat uit fabrieken die de telefoon in elkaar zetten, leveranciers van onderdelen en hún leveranciers.\",\"h\":7},{\"t\":\" \",\"h\":-1},{\"t\":\"Fairphone controleert leveranciers op werkveiligheid en arbeidsomstandigheden en laat onderzoeken hoe werknemers hun werk ervaren.\",\"h\":8},{\"t\":\"\",\"h\":-2},{\"t\":\"Sinds 2019 betaalt Fairphone een loonbonus aan werknemers bij leveranciers.\",\"h\":9},{\"t\":\" Die bonus moet het verschil verkleinen tussen het loon dat zij krijgen en \",\"h\":-1},{\"t\":\"een leefbaar loon: een loon waarmee iemand bij een normale werkweek wonen, eten, zorg en onderwijs voor zichzelf en het gezin kan betalen. Het wettelijke minimumloon is daar in veel productielanden niet hoog genoeg voor.\",\"h\":10},{\"t\":\"\",\"h\":-2},{\"t\":\"De hoogte van de bonus hangt af van hoeveel Fairphone in een fabriek laat produceren. Het geld wordt verdeeld onder de laagstbetaalde werknemers. \",\"h\":-1},{\"t\":\"Die fabrieken produceren ook voor andere telefoonmerken; Fairphone is daar één van meerdere klanten, en vaak een kleine.\",\"h\":11},{\"t\":\" \",\"h\":-1},{\"t\":\"Bij één onderleverancier krijgen inmiddels alle werknemers een volledig leefbaar loon.\",\"h\":12},{\"t\":\"\",\"h\":-2},{\"t\":\"Fairphone publiceert handleidingen over de loonbonus, zodat andere bedrijven de aanpak kunnen overnemen.\",\"h\":13},{\"t\":\" \",\"h\":-1},{\"t\":\"Ook helpt het bedrijf loonramingen voor 165 landen openbaar te maken, zodat bedrijven, werknemers en vakbonden die kunnen gebruiken.\",\"h\":14}],\"hl\":[{\"ts\":[{\"n\":24,\"l\":\"m\",\"w\":\"Let op het verschil: de klant koopt hier de telefoon, het is geen Product-as-a-Service.\"},{\"n\":23,\"l\":\"m\",\"w\":\"Welk verdienmodel hoort hierbij en hoe circulair is het?\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":45,\"l\":\"m\",\"w\":\"Groeien én steeds beter worden, niet alleen opschalen.\"},{\"n\":61,\"l\":\"m\",\"w\":\"Groei en verkoop wegen tegen de duurzaamheidsambitie.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":26,\"l\":\"h\",\"w\":\"Garantie en updates verlengen de gebruiksduur voordat het product wordt afgedankt.\"},{\"n\":48,\"l\":\"h\",\"w\":\"Een ontwerp dat schade aan mens en milieu beperkt: duurzaam design.\"}],\"q\":\"Welke vorm van levensduurverlenging past Fairphone toe? Noem er twee.\",\"a\":\"Vijf jaar garantie met software-updates tot 2033, en reparatie: twaalf onderdelen zijn zelf te vervangen (batterij, scherm, camera) of de telefoon gaat naar een reparatiecentrum. Zo wordt de telefoon langer gebruikt voordat hij wordt afgedankt.\",\"gen\":0},{\"ts\":[{\"n\":20,\"l\":\"h\",\"w\":\"Een defect onderdeel herstellen in plaats van de hele telefoon vervangen: repair.\"},{\"n\":84,\"l\":\"h\",\"w\":\"Het modulaire ontwerp maakt reparatie makkelijk: een ingreep op ontwerpniveau.\"}],\"q\":\"Welk type interventie is een modulair ontwerp? Leg uit hoe het repair mogelijk maakt.\",\"a\":\"Een ontwerpinterventie: de ingreep zit in het product zelf. Onderdelen zijn met een schroevendraaier te vervangen en een batterij is in vijf tot tien minuten gewisseld. Daardoor is de drempel voor reparatie laag en vervang je een defect onderdeel in plaats van de hele telefoon (repair, hoog op de R-ladder).\",\"gen\":0},{\"ts\":[{\"n\":16,\"l\":\"h\",\"w\":\"Repareren staat hoger op de R-ladder dan recyclen: de eigenaar krijgt de keuze.\"},{\"n\":21,\"l\":\"m\",\"w\":\"Recycling is de lagere optie, maar voorkomt verspilling als reparatie niet kan.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":62,\"l\":\"h\",\"w\":\"Reparatie is een hoge trede, maar nieuwe telefoons blijven verkopen is geen refuse of reduce: hoe circulair is de strategie echt?\"},{\"n\":15,\"l\":\"m\",\"w\":\"Blijven producten en materialen echt in de kringloop, of wordt er nog steeds nieuw geproduceerd?\"}],\"q\":\"Hoe circulair is Fairphone echt zolang het nieuwe telefoons blijft verkopen? Gebruik de R-ladder.\",\"a\":\"Fairphone scoort hoog op repair, reuse (lange levensduur) en recycle, maar de allerhoogste treden (niet produceren, minder consumeren) bereikt het niet: het wil groeien en blijft nieuwe telefoons verkopen. Conclusie: duidelijk circulairder dan gebruikelijk, maar nog niet volledig circulair.\",\"gen\":0},{\"ts\":[{\"n\":21,\"l\":\"h\",\"w\":\"Gerecyclede materialen worden weer grondstof.\"},{\"n\":9,\"l\":\"m\",\"w\":\"Goud, kobalt en aluminium komen uit de aardkorst: de lithosfeer.\"},{\"n\":90,\"l\":\"m\",\"w\":\"\\\"Eerlijk gewonnen\\\" en \\\"volgens Fairphone\\\": wat is het meetbare criterium en wie controleert het?\"},{\"n\":89,\"l\":\"m\",\"w\":\"De andere helft van het gewicht blijft buiten beeld.\"}],\"q\":\"Welke vragen zou je stellen om te toetsen of deze claim klopt?\",\"a\":\"Wat betekent \\\"eerlijk gewonnen\\\" precies, en welk criterium wordt gebruikt? Wie controleert dat, en is het verifieerbaar? Hoeveel is gerecycled en hoeveel alleen \\\"eerlijk\\\"? Gaat het om alle materialen of alleen goud, kobalt en aluminium? Wat gebeurt er met de andere helft van het gewicht? (Vage of niet-verifieerbare claims en selectieve communicatie.)\",\"gen\":0},{\"ts\":[{\"n\":5,\"l\":\"h\",\"w\":\"Tot hoever reikt je analyse: alleen fabrieken, of ook leveranciers van leveranciers?\"},{\"n\":1,\"l\":\"h\",\"w\":\"Een keten van onderling afhankelijke partijen, niet losse onderdelen.\"},{\"n\":58,\"l\":\"h\",\"w\":\"Fabrieken, leveranciers, werknemers: wie heeft belang bij of invloed op de keten?\"},{\"n\":57,\"l\":\"m\",\"w\":\"Een systeemkaart van actoren en relaties maakt de keten overzichtelijk.\"}],\"q\":\"Welke systeemgrens kies je voor de keten van Fairphone, en wat valt er dan buiten?\",\"a\":\"Je kunt de grens leggen bij de fabrieken die de telefoon assembleren, of ruimer: ook onderdelenleveranciers en hún leveranciers tot de winning van grondstoffen. Hoe ruimer de grens, hoe meer oorzaken en oplossingen je ziet (zoals lonen en arbeidsomstandigheden diep in de keten). Buiten een smalle grens vallen de diepere schakels, en buiten elke grens bijvoorbeeld gebruik en afdanking.\",\"gen\":0},{\"ts\":[{\"n\":40,\"l\":\"h\",\"w\":\"De ervaring van werknemers wordt actief meegenomen in de keuzes.\"},{\"n\":34,\"l\":\"m\",\"w\":\"Veiligheid, vaardigheden en motivatie van medewerkers.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":85,\"l\":\"h\",\"w\":\"Een ingreep op organisatieniveau in de keten.\"},{\"n\":80,\"l\":\"h\",\"w\":\"De onderneming neemt verantwoordelijkheid voor partijen die risico dragen, ook buiten het eigen bedrijf.\"}],\"q\":\"Welk model past hier: aandeelhouders- of stakeholdersmodel? Leg uit met de loonbonus.\",\"a\":\"Het stakeholdersmodel: Fairphone betaalt een loonbonus aan werknemers van leveranciers, partijen die geen eigenaar zijn maar wel arbeid inbrengen en risico lopen. Bij een aandeelhoudersmodel zou dat alleen gebeuren als het rendement dient.\",\"gen\":0},{\"ts\":[{\"n\":64,\"l\":\"h\",\"w\":\"Wie krijgt welk deel van de waarde in de keten, en waarom?\"},{\"n\":63,\"l\":\"h\",\"w\":\"Loon is geen neutrale marktuitkomst maar een morele keuze.\"},{\"n\":67,\"l\":\"m\",\"w\":\"Te lage lonen: de kosten dragen werknemers en gezinnen, niet de merken.\"},{\"n\":86,\"l\":\"m\",\"w\":\"Het wettelijk minimumloon schiet tekort: regelgeving als interventieniveau.\"}],\"q\":\"Waarom is een leefbaar loon een vraag van rechtvaardige verdeling en niet alleen van economie?\",\"a\":\"Het gaat om wie welk deel van de waarde in de keten krijgt en waarom. Lonen zijn geen waardevrije marktuitkomst maar een morele keuze (morele economie). Het wettelijk minimumloon is te laag om te wonen, eten, zorg en onderwijs te betalen; die kosten dragen anders de werknemers en hun gezinnen (externaliteit).\",\"gen\":0},{\"ts\":[{\"n\":76,\"l\":\"h\",\"w\":\"Hoeveel invloed heeft een kleine speler binnen een systeem dat sterker is dan hijzelf?\"},{\"n\":68,\"l\":\"m\",\"w\":\"Fabrieken volgen hun eigen ontwerpdoel (prijs, volume), niet vanzelf morele waarden.\"},{\"n\":74,\"l\":\"m\",\"w\":\"Als alle merken het aan elkaar laten, voelt niemand zich verantwoordelijk voor het loon.\"}],\"q\":\"Wat is de agency van Fairphone binnen deze keten, en waar zijn de grenzen?\",\"a\":\"Agency: Fairphone maakt zelf keuzes binnen een sterker systeem: het betaalt een bonus, controleert leveranciers en publiceert zijn aanpak. Grenzen: het is vaak een kleine klant bij fabrieken die ook voor andere merken produceren, de bonus hangt af van het productievolume en gaat naar de laagstbetaalden, en fabrieken volgen hun eigen systeemlogica (prijs en volume).\",\"gen\":0},{\"ts\":[{\"n\":92,\"l\":\"m\",\"w\":\"Klein succes bij één leverancier kan in de communicatie groter overkomen dan het totaaleffect.\"},{\"n\":89,\"l\":\"m\",\"w\":\"Eén positief voorbeeld wordt uitgelicht.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":53,\"l\":\"h\",\"w\":\"Een kleine ingreep kan het hele systeem veranderen als anderen volgen.\"},{\"n\":33,\"l\":\"m\",\"w\":\"Kennis en methoden die Fairphone deelt.\"},{\"n\":12,\"l\":\"m\",\"w\":\"Hoe meer bedrijven volgen, hoe sterker de norm wordt.\"}],\"q\":\"Waar zit het hefboompunt in dit voorbeeld en waarom?\",\"a\":\"In het delen van de aanpak: handleidingen publiceren en loonramingen voor 165 landen openbaar maken. Als andere bedrijven dit overnemen, groeit een kleine ingreep uit tot verandering in veel fabrieken, en versterkt de norm zich (positieve feedbackloop).\",\"gen\":0},{\"ts\":[{\"n\":35,\"l\":\"m\",\"w\":\"Samenwerking en vertrouwen met vakbonden, werknemers en andere bedrijven.\"},{\"n\":87,\"l\":\"m\",\"w\":\"Openbare data verkleinen het informatieverschil en dus de datamacht van een enkele partij.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":59,\"l\":\"m\",\"w\":\"Fairphone heeft weinig macht bij grote fabrieken maar veel belang, werknemers hebben veel belang en weinig macht: hoe positioneer je ze?\"}],\"q\":\"Maak een korte belangenanalyse van Fairphone, de fabrieken en de werknemers.\",\"a\":\"Fairphone: groot belang (merkbelofte), beperkte macht (kleine klant). Fabrieken: veel macht (bepalen productie en lonen, andere klanten), gemiddeld belang. Werknemers: zeer groot belang, weinig macht. Dus betrek je werknemers en vakbonden actief (stakeholderbetrokkenheid) en zoek je samenwerking met andere merken.\",\"gen\":1}]},{\"title\":\"Casus 3 – Interface\",\"short\":\"Interface\",\"segs\":[{\"t\":\"Interface maakt tapijttegels voor kantoren, scholen en andere gebouwen. \",\"h\":-1},{\"t\":\"Voor de productlijn Entropy keek een ontwerper naar bladeren op een bosvloer. Daar zag hij een geheel van onderdelen die op elkaar lijken, maar nooit precies gelijk zijn.\",\"h\":0},{\"t\":\" De Entropy-tegels verschillen daarom in kleur en patroon. \",\"h\":-1},{\"t\":\"Ze hoeven niet in dezelfde richting te liggen, en een vervangende tegel hoeft niet uit dezelfde productiepartij te komen. Klanten hoeven zo minder reservetegels op voorraad te houden en kunnen een beschadigde tegel los vervangen.\",\"h\":1},{\"t\":\" \",\"h\":-1},{\"t\":\"Bij het leggen ontstaat gemiddeld 1,5 procent snijafval.\",\"h\":2},{\"t\":\"\",\"h\":-2},{\"t\":\"Met adviesbureau Biomimicry 3.8 ontwikkelde Interface de aanpak Factory as a Forest.\",\"h\":3},{\"t\":\" Eerst wordt een gezond ecosysteem in de buurt van een fabriek onderzocht, bijvoorbeeld een beschermd bos. \",\"h\":-1},{\"t\":\"Biologen meten hoeveel water dat bos filtert, hoeveel koolstof het opslaat en hoeveel leefruimte het biedt aan planten en dieren. Die cijfers worden doelen voor het fabrieksterrein.\",\"h\":4},{\"t\":\" \",\"h\":-1},{\"t\":\"Daarna worden maatregelen ontworpen die passen bij de plek, en na uitvoering wordt opnieuw gemeten.\",\"h\":5},{\"t\":\" \",\"h\":-1},{\"t\":\"Omdat natuur per plek verschilt, vraagt elke locatie eigen onderzoek. De aanpak werd ontwikkeld bij een fabriek in de Verenigde Staten.\",\"h\":6},{\"t\":\"\",\"h\":-2},{\"t\":\"Via het programma ReEntry neemt Interface gebruikte tegels terug. Afhankelijk van hun staat worden ze hergebruikt, gerecycled of verbrand voor energie.\",\"h\":7},{\"t\":\" \",\"h\":-1},{\"t\":\"In 2024 breidde Interface zijn recyclinglocatie in Scherpenzeel uit, speciaal voor tegels die niet meer herbruikbaar zijn. Het materiaal daaruit gaat naar nieuwe tegels.\",\"h\":8},{\"t\":\"\",\"h\":-2},{\"t\":\"Interface verkoopt tapijttegels die het CO₂-negatief noemt, en wil in 2040 als bedrijf CO₂-negatief zijn.\",\"h\":9},{\"t\":\" \",\"h\":-1},{\"t\":\"Bij de berekening voor deze tegels telde Interface de stappen van de winning van grondstoffen tot het moment waarop de tegel de fabriek verlaat. Dit heet cradle-to-gate.\",\"h\":10},{\"t\":\" \",\"h\":-1},{\"t\":\"De berekening geldt voor bepaalde combinaties van rugmateriaal, garen en productiewijze. Interface vermeldt ook dat een CO₂-negatieve achterkant niet betekent dat de hele tegel CO₂-negatief is.\",\"h\":11},{\"t\":\"\",\"h\":-2},{\"t\":\"In 2024 kondigde Interface aan te stoppen met CO₂-compensatie.\",\"h\":12},{\"t\":\" \",\"h\":-1},{\"t\":\"Vanaf 2025 gaat dat geld naar het verminderen van uitstoot en het opslaan van koolstof in producten en productie.\",\"h\":13},{\"t\":\" \",\"h\":-1},{\"t\":\"De klimaatcijfers worden volgens Interface door een externe partij gecontroleerd en gepubliceerd in productdocumenten en jaarverslagen.\",\"h\":14}],\"hl\":[{\"ts\":[{\"n\":41,\"l\":\"h\",\"w\":\"Een oplossing ontleend aan de natuur, hier op het niveau van het ecosysteem.\"},{\"n\":42,\"l\":\"h\",\"w\":\"De natuur als set ontwerpprincipes: welk principe zie je terug?\"}],\"q\":\"Op welk niveau (organisme, gedrag, ecosysteem) is Entropy biomimicry? Welk Life's Principle past?\",\"a\":\"Op ecosysteemniveau: de ontwerper kijkt naar bladeren op een bosvloer, een geheel van onderdelen die op elkaar lijken maar nooit gelijk zijn. Passende principes: Be resource efficient (weinig snijafval, minder reservetegels) en Adapt to changing conditions (variatie, een tegel los kunnen vervangen).\",\"gen\":0},{\"ts\":[{\"n\":20,\"l\":\"h\",\"w\":\"Een beschadigde tegel los vervangen in plaats van de hele vloer: repair.\"},{\"n\":26,\"l\":\"m\",\"w\":\"De vloer blijft langer in gebruik.\"},{\"n\":44,\"l\":\"m\",\"w\":\"Variatie maakt het systeem flexibel als er iets verandert.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":43,\"l\":\"h\",\"w\":\"Weinig materiaalverlies: zuinig met materiaal.\"},{\"n\":18,\"l\":\"m\",\"w\":\"Afval beperken door een slimmer ontwerp: reduce.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":49,\"l\":\"h\",\"w\":\"Het doel is niet alleen minder schade maar het ecosysteem rond de fabriek actief herstellen en versterken.\"},{\"n\":41,\"l\":\"m\",\"w\":\"Het gezonde bos als voorbeeld en ijkpunt voor het fabrieksterrein.\"},{\"n\":48,\"l\":\"m\",\"w\":\"Het contrast: duurzaam design beperkt schade, regeneratief design herstelt.\"}],\"q\":\"Wat is het verschil tussen duurzaam en regeneratief design? Gebruik Factory as a Forest.\",\"a\":\"Duurzaam design beperkt schade (minder afval en energie). Regeneratief design herstelt en versterkt de systemen waarin het functioneert. Bij Factory as a Forest worden de prestaties van een gezond bos (water filteren, koolstof opslaan, leefruimte) gemeten en doelen voor het fabrieksterrein: het terrein moet het ecosysteem versterken, niet alleen minder schaden.\",\"gen\":0},{\"ts\":[{\"n\":36,\"l\":\"h\",\"w\":\"Waterfiltering, koolstofopslag en leefruimte zijn ecosysteemdiensten: natuurlijk kapitaal.\"},{\"n\":8,\"l\":\"m\",\"w\":\"Water filteren hoort bij de kringloop van de hydrosfeer.\"},{\"n\":6,\"l\":\"m\",\"w\":\"Leefruimte voor planten en dieren: de biosfeer.\"},{\"n\":7,\"l\":\"m\",\"w\":\"Koolstof opslaan raakt aan de atmosfeer en het klimaat.\"}],\"q\":\"Welke vormen van natuurlijk kapitaal herken je in Factory as a Forest?\",\"a\":\"Ecosysteemdiensten: waterfiltering, koolstofopslag en leefruimte voor planten en dieren (biodiversiteit). Het gezonde bos in de buurt is de referentie voor wat het fabrieksterrein moet leveren.\",\"gen\":0},{\"ts\":[{\"n\":47,\"l\":\"m\",\"w\":\"Oplossingen afstemmen op de lokale context en daarop reageren.\"},{\"n\":52,\"l\":\"m\",\"w\":\"Meten, aanpassen en opnieuw meten is een terugkoppeling.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":47,\"l\":\"h\",\"w\":\"Wat lokaal werkt, kopieer je niet zomaar naar een andere plek.\"},{\"n\":60,\"l\":\"m\",\"w\":\"Eerst de lokale omgeving in kaart brengen, daarna ontwerpen.\"}],\"q\":\"Waarom kun je de aanpak van de Amerikaanse fabriek niet zomaar overal toepassen?\",\"a\":\"Natuur verschilt per plek, dus elke locatie vraagt eigen onderzoek naar het lokale ecosysteem (Be locally attuned and responsive). Eerst de omgeving in kaart brengen, dan ontwerpen (context mapping). De methode (meten, doelen stellen, ontwerpen, opnieuw meten) kun je wel herhalen, de doelen en maatregelen niet.\",\"gen\":0},{\"ts\":[{\"n\":16,\"l\":\"h\",\"w\":\"Drie treden van de R-ladder in één zin: hergebruiken, recyclen en terugwinnen.\"},{\"n\":19,\"l\":\"h\",\"w\":\"Tegels die nog goed zijn worden opnieuw ingezet.\"},{\"n\":21,\"l\":\"h\",\"w\":\"Afgedankt materiaal wordt weer grondstof.\"},{\"n\":22,\"l\":\"h\",\"w\":\"Verbranden voor energie is de laagste trede: terugwinnen.\"},{\"n\":15,\"l\":\"m\",\"w\":\"Gebruikte producten gaan terug de kringloop in.\"},{\"n\":23,\"l\":\"m\",\"w\":\"Terugnemen is onderdeel van een circulair businessmodel.\"}],\"q\":\"Plaats Reuse, Recycle en Recover op de R-ladder en leg uit welke het meeste waarde behoudt.\",\"a\":\"Van hoog naar laag: Reuse, Recycle, Recover. Reuse behoudt het product in de huidige vorm en dus de meeste waarde. Recycle maakt er nieuwe grondstof van (waardeverlies, maar geen verspilling). Recover, verbranden voor energie, is de laagste trede. Interface kiest per tegel wat past bij de staat.\",\"gen\":0},{\"ts\":[{\"n\":21,\"l\":\"h\",\"w\":\"Recycling van tegels die niet meer herbruikbaar zijn.\"},{\"n\":15,\"l\":\"m\",\"w\":\"Een gesloten kringloop: oud materiaal wordt nieuwe grondstof.\"},{\"n\":62,\"l\":\"m\",\"w\":\"Recycling staat laag op de R-ladder: voorkomen en hergebruiken zijn beter.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":90,\"l\":\"h\",\"w\":\"Wat betekent \\\"CO₂-negatief\\\" precies, en is dat meetbaar en verifieerbaar?\"},{\"n\":88,\"l\":\"m\",\"w\":\"Een groene claim: klopt hij met de werkelijke impact?\"},{\"n\":29,\"l\":\"m\",\"w\":\"CO₂-negatief gaat over de balans met het koolstofbudget.\"}],\"q\":\"Is \\\"CO₂-negatief\\\" een duidelijke claim? Welke aanvullende informatie heb je nodig?\",\"a\":\"Niet vanzelf. Je moet weten welke afbakening is gebruikt (cradle-to-gate?), voor welke combinaties van rugmateriaal, garen en productiewijze, welke berekeningsmethode en wie het controleert, wat is meegeteld (opslag, compensatie) en of het voor de hele tegel geldt of een deel. Zonder die informatie is het een vage of niet-verifieerbare claim.\",\"gen\":0},{\"ts\":[{\"n\":27,\"l\":\"h\",\"w\":\"Een levenscyclusberekening, maar niet de hele cyclus: cradle-to-gate in plaats van tot afdanking.\"},{\"n\":5,\"l\":\"h\",\"w\":\"De gekozen afbakening: gebruiksfase en afdanking vallen erbuiten.\"}],\"q\":\"Welke systeemgrens heeft Interface gekozen en wat valt erbuiten? Waarom maakt dat uit?\",\"a\":\"Cradle-to-gate: van de winning van grondstoffen tot het moment dat de tegel de fabriek verlaat. Erbuiten vallen onder meer transport, gebruik, onderhoud en afdanking. Dat maakt uit omdat de afbakening bepaalt welke gevolgen je ziet: binnen de grens kan een tegel CO₂-negatief lijken en over de hele levenscyclus (LCA) anders uitpakken.\",\"gen\":0},{\"ts\":[{\"n\":89,\"l\":\"h\",\"w\":\"Alleen een deel (de achterkant, bepaalde combinaties) wordt uitgelicht.\"},{\"n\":88,\"l\":\"m\",\"w\":\"Risico op greenwashing, ook al noemt Interface de beperking zelf.\"}],\"q\":\"Is hier sprake van greenwashing? Welke vorm, en wat doet Interface om dat te voorkomen?\",\"a\":\"Er is een risico op selectieve communicatie: alleen een deel (de achterkant, bepaalde combinaties) heet CO₂-negatief. Interface vermindert dat risico door de beperking zelf te noemen (niet de hele tegel is CO₂-negatief) en door externe controle en publicatie. Dus een risico, maar transparant: geen duidelijke greenwashing.\",\"gen\":0},{\"ts\":[{\"n\":88,\"l\":\"m\",\"w\":\"Compensatie kan als greenwashing gezien worden: de eigen uitstoot verdwijnt niet.\"},{\"n\":74,\"l\":\"m\",\"w\":\"Compenseren legt de oplossing buiten het eigen bedrijf.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":18,\"l\":\"h\",\"w\":\"Eerst de uitstoot zelf verminderen in plaats van compenseren.\"},{\"n\":62,\"l\":\"m\",\"w\":\"Voorkomen en verminderen zijn de hogere stappen.\"},{\"n\":49,\"l\":\"m\",\"w\":\"Koolstof opslaan in producten: versterken in plaats van alleen beperken.\"}],\"q\":\"\",\"a\":\"\",\"gen\":0},{\"ts\":[{\"n\":90,\"l\":\"h\",\"w\":\"Externe controle en publicatie maken de claim verifieerbaar.\"},{\"n\":38,\"l\":\"m\",\"w\":\"Rapporteren over de eigen klimaatimpact.\"}],\"q\":\"Hoe maakt externe controle een duurzaamheidsclaim betrouwbaarder?\",\"a\":\"Een onafhankelijke partij toetst de cijfers en publicatie in productdocumenten en jaarverslagen maakt ze controleerbaar voor stakeholders. Dat maakt de claim verifieerbaar en het tegenovergestelde van een vage of niet-verifieerbare claim.\",\"gen\":0}]}]};\n    const tc = Math.min(Math.max(s.tc || 0, 0), TD.cases.length - 1);\n    const C = TD.cases[tc];\n    const hi = (s.thl === undefined || s.thl === null) ? -1 : s.thl;\n    const fn = s.tfn || 0;\n    const LV = { h: { col: '#5C7A5A', badge: 'Verwacht', bcss: 'background:#D5E7D3;color:#3F5B3D;' }, m: { col: '#C9973A', badge: 'Mogelijk', bcss: 'background:#F8EBC8;color:#7D6034;' } };\n    const lvOf = (h) => (h.ts.some((t) => t.l === 'h') ? 'h' : 'm');\n    const sel = hi >= 0 && hi < C.hl.l  = i; a.l = 'h'; }\n      a.cnt++; if (h.gen) a.gen = true;\n    }));\n    const rows = Object.keys(agg).map((k) => agg[k]).sort((p, q) => (p.l === q.l ? 0 : p.l === 'h' ? -1 : 1) || q.cnt - p.cnt || p.n - q.n);\n    const nH = rows.filter((r) => r.l === 'h').length;\n\n    if (sel < 0) {\n      v.tIdle = true;\n      v.tKick = 'Toets donderdag 29 oktober';\n      v.tHead = 'Casus ' + (tc + 1) + ' (' + C.short + '): verwachte begrippen';\n      v.tIntro = rows.length + ' begrippen gekoppeld, waarvan ' + nH + ' verwacht. Klik een gemarkeerde zin of een begrip hieronder. Dit is mijn analyse van de casus, geen officiële toetsmatrijs.';\n      v.tRows = rows.map((r) => ({\n        name: W.nodes[r.n].short, col: LV[r.l].col,\n        rel: r.gen && r.cnt === 1 ? 'hele casus' : r.cnt + (r.cnt === 1 ? ' plek' : ' plekken'),\n        css: fn === r.n ? 'border:1px solid #D0E3CF;background:#EDF3EC;' : 'border:1px solid transparent;background:transparent;',\n        go: () => pick(r.first, r.n)\n      }));\n    } else {\n      const h = C.hl[sel];\n      v.tSel = true;\n      v.tSelKick = 'Casus ' + (tc + 1) + ' · ' + (h.gen ? 'hele casus' : 'gemarkeerde zin');\n      v.tQuote = h.gen ? 'Dit begrip geldt voor de casus als geheel, niet voor één zin.' : C.segs.filter((x) => x.h === sel).map((x) => x.t).join(' ');\n      const ts = h.ts.slice().sort((p, q) => (q.n === fn ? 1 : 0) - (p.n === fn ? 1 : 0) || (p.l === q.l ? 0 : p.l === 'h' ? -1 : 1));\n      v.tEnts = ts.map((t) => {\n        const nd = W.nodes[t.n], L = LV[t.l];\n        return { name: nd.name, fs: nd.name.length > 34 ? 15 : nd.name.length > 24 ? 17 : 19, les: nd.les + ' · ' + nd.lesT, def: nd.def, w: t.w, badge: L.badge, bcss: L.bcss };\n      });\n      v.tHasQ = !!h.q; v.tQ = h.q; v.tA = h.a || '';\n      v.onTOverview = () => this.setState({ thl: -1, tfn: 0 });\n      const btn = (label, go, prim) => ({ label, go, css: prim ? 'border:0;background:#5C7A5A;color:#fff;' : 'border:1px solid #E4DDD6;background:#fff;co
