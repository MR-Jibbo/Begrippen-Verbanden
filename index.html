ties meet, tegelijk.' },\n        { n: `SDG's`, s: 'Sustainable Development Goals', d: `De zeventien duurzaamheidsdoelen van de Verenigde Naties; een internationaal referentiekader voor beleid tot 2030.`, x: `Een gemeente koppelt haar plannen aan doelen als schoon water of klimaatactie.`, k: 'dots17', a: {}, c: 'Zeventien doelen, één gezamenlijke einddatum.' },\n        { n: 'Systeemgrenzen', d: `De keuze wat je wél en niet meeneemt in een systeemanalyse. Die afbakening bepaalt welke oorzaken, gevolgen en oplossingen je ziet.`, x: `Meet je alleen de fabriek, of ook de grondstoffen en het afval erna?`, k: 'boundary', a: { mode: 'sys' }, c: 'Hoe groter de grens, hoe meer je ziet.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 2', t: 'Aarde als systeem & planetaire grenzen', items: [\n        { n: 'Biosfeer', d: `De laag van de aarde waarin leven voorkomt: alle levende organismen en hun onderlinge interacties.`, x: `Een bos met planten, dieren en schimmels die elkaar nodig hebben.`, k: 'rings', a: earth(2), c: 'De vier aardsferen als lagen om elkaar heen.' },\n        { n: 'Atmosfeer', d: `De luchtlaag rond de aarde. Ze reguleert het klimaat en maakt de aarde leefbaar.`, x: `Zonder atmosfeer zou het overdag veel heter en 's nachts veel kouder zijn.`, k: 'rings', a: earth(3), c: 'De buitenste laag: lucht en klimaat.' },\n        { n: 'Hydrosfeer', d: `Al het water op aarde, van oceanen en rivieren tot ijs en grondwater, plus de kringlopen daarvan.`, x: `Regen valt, stroomt naar zee, verdampt en wordt weer regen.`, k: 'rings', a: earth(1), c: 'Water in al zijn vormen en kringlopen.' },\n        { n: 'Lithosfeer', d: `De vaste aardkorst en bodem, inclusief de grondstoffen die daarin te vinden zijn.`, x: `De metalen in je telefoon komen uit de lithosfeer.`, k: 'rings', a: earth(0), c: 'De vaste kern waar grondstoffen in zitten.' },\n        { n: 'Planetaire grenzen', d: `Wetenschappelijke drempelwaarden, bijvoorbeeld voor klimaat, biodiversiteit en stikstof en fosfor, waarbinnen de aarde stabiel blijft. Overschrijding vergroot het risico op onomkeerbare veranderingen.`, x: `Als een brug met een maximaal gewicht: daarboven neemt het risico op instorten toe.`, k: 'limits', a: {}, c: 'Schematisch: elke grens heeft een drempel.' },\n        { n: 'Tipping point', s: 'omslagpunt', d: `Een drempel in een systeem waarna een kleine extra verandering een grote, vaak onomkeerbare verschuiving veroorzaakt.`, x: `Een bal op een heuveltop: één duwtje en hij rolt naar de andere kant.`, k: 'tipping', a: { mode: 'tip' }, c: 'Kleine duwtjes, tot één duw het systeem laat omslaan.' },\n        { n: 'Positieve feedback(loop)', d: `Een terugkoppeling die een effect versterkt, waardoor een verandering zichzelf aanjaagt.`, x: `Smeltend ijs legt donker water bloot, dat meer warmte opneemt, waardoor er nog meer ijs smelt.`, k: 'loop', a: { mode: '+', labels: ['Ijs smelt', 'Donker water', 'Meer warmte', 'Water warmer'], signs: ['+', '+', '+', '+'] }, c: 'Het effect voedt zichzelf: steeds sneller.' },\n        { n: 'Negatieve feedback(loop)', d: `Een terugkoppeling die een effect afremt of dempt, waardoor het systeem naar een nieuw evenwicht beweegt.`, x: `Een thermostaat: wordt het te warm, dan gaat de verwarming uit.`, k: 'loop', a: { mode: '-', labels: ['Te warm', 'Verwarming uit', 'Koelt af', 'Verwarming aan'], signs: ['+', '-', '+', '+'] }, c: 'Het effect remt zichzelf: het systeem komt tot rust.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 3', t: 'Van lineair naar circulair: economische modellen en strategieën', items: [\n        { n: 'Lineaire economie', d: `Een model van winnen, maken, gebruiken en weggooien: grondstoffen worden eenmalig ingezet en afval is het eindpunt.`, x: `Een wegwerpbeker: gemaakt, één keer gebruikt, in de prullenbak.`, k: 'flow', a: { mode: 'lin' }, c: 'Een rechte lijn met een stapel afval aan het eind.' },\n        { n: 'Circulaire economie', d: `Grondstoffen en producten blijven zo lang mogelijk in de kringloop, afval wordt geminimaliseerd en waarde blijft behouden.`, x: `Een telefoon die wordt teruggenomen, opgeknapt en opnieuw verkocht.`, k: 'flow', a: { mode: 'circ' }, c: 'Van lijn naar cirkel: niets wordt afval.' },\n        { n: 'R-ladder', d: `Een rangorde van circulaire strategieën, van meeste naar minste waardebehoud. Hoe hoger op de ladder, hoe beter.`, x: `Een kapotte fiets repareren (hoog) is beter dan hem recyclen (lager).`, k: 'ladder', a: ladder('cycle'), c: 'Zes treden, van waardebehoud hoog naar laag.' },\n        { n: 'Refuse', s: 'weigeren', p: 'R-ladder', d: `Onnodig grondstof- of verpakkingsgebruik voorkomen door het al bij het ontwerp of de inkoop te vermijden.`, x: `Geen plastic folie om een komkommer.`, k: 'ladder', a: ladder(0), c: 'De hoogste trede: het probleem voorkomen.' },\n        { n: 'Reduce', s: 'verminderen', p: 'R-ladder', d: `Grondstofgebruik en afval beperken met efficiëntere processen en slimmere materiaalkeuzes.`, x: `Een lichtere verpakking met dezelfde bescherming.`, k: 'ladder', a: ladder(1), c: 'Minder materiaal voor hetzelfde resultaat.' },\n        { n: 'Reuse', s: 'hergebruiken', p: 'R-ladder', d: `Een product of materiaal in de huidige vorm opnieuw inzetten in plaats van het te vervangen.`, x: `Statiegeldflessen die schoongemaakt en opnieuw gevuld worden.`, k: 'ladder', a: ladder(2), c: 'Zelfde product, nieuwe gebruiker.' },\n        { n: 'Repair', s: 'repareren', p: 'R-ladder', d: `Een defect product herstellen in plaats van vervangen, waardoor de levensduur langer wordt.`, x: `Een nieuwe accu in je laptop in plaats van een nieuwe laptop.`, k: 'ladder', a: ladder(3), c: 'Herstellen wat stuk is.' },\n        { n: 'Recycle', s: 'recyclen', p: 'R-ladder', d: `Afgedankt materiaal verwerken tot nieuwe grondstof. Dat behoudt minder waarde dan de treden erboven, maar voorkomt verspilling.`, x: `Oude plastic flessen die weer plastic korrels worden.`, k: 'ladder', a: ladder(4), c: 'Het product verdwijnt, het materiaal blijft.' },\n        { n: 'Recover', s: 'terugwinnen', p: 'R-ladder', d: `De laagste trede: nog energie of grondstoffen terugwinnen uit materiaal dat niet meer herbruikt of gerecycled kan worden.`, x: `Restafval verbranden en de warmte gebruiken voor stroom.`, k: 'ladder', a: ladder(5), c: 'Laatste redmiddel voordat het afval wordt.' },\n        { n: 'Circulaire businessmodellen', d: `Verdienmodellen die eigendom en gebruik loskoppelen of de levensduur van producten verlengen.`, x: `Je koopt geen lampen, maar abonneert je op licht.`, k: 'radial', a: BMP(-1), c: 'Drie manieren om te verdienen zonder weg te gooien.' },\n        { n: 'Product-as-a-Service', p: 'Circulaire businessmodellen', d: `De klant betaalt voor gebruik, bijvoorbeeld via lease of abonnement. De aanbieder blijft eigenaar en regelt onderhoud en het einde van de levensduur.`, x: `Een leaseplan voor verlichting: de leverancier houdt de lampen in stand en neemt ze terug.`, k: 'bm', a: { mode: 'paas' }, c: 'Het product keert terug naar de eigenaar.' },\n        { n: 'Sharing platforms', p: 'Circulaire businessmodellen', d: `Platformen waarop meerdere gebruikers dezelfde producten delen, zodat er minder exemplaren nodig zijn.`, x: `Een deelauto die door tientallen buurtbewoners wordt gebruikt.`, k: 'bm', a: { mode: 'share' }, c: 'Eén exemplaar, meerdere gebruikers.' },\n        { n: 'Levensduurverlenging', p: 'Circulaire businessmodellen', d: `Reparatie, opknappen en upgraden: strategieën die de gebruiksduur verlengen voordat een product wordt afgedankt.`, x: `Je smartphone een nieuw scherm en een update geven in plaats van hem te vervangen.`, k: 'bm', a: { mode: 'extend' }, c: 'Elke stap schuift het afdankmoment op.' },\n        { n: 'LCA', s: 'Life Cycle Assessment', d: `Een methode om de milieu-impact van een product over zijn hele levenscyclus te berekenen, van grondstof tot afdanking.`, x: `Vergelijken welke fles over de hele keten de minste milieu-impact heeft.`, k: 'lca', a: {}, c: 'Alle fasen tellen mee, niet alleen het gebruik.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 4', t: 'Klimaatverandering & infrastructuur', items: [\n        { n: 'Broeikaseffect', d: `Het natuurlijke proces waarbij broeikasgassen in de atmosfeer warmte vasthouden. Menselijke uitstoot versterkt dit effect en leidt tot opwarming.`, x: `Een tuinkas: zonlicht komt binnen, de warmte kan er moeilijk uit.`, k: 'greenhouse', a: {}, c: 'Meer broeikasgassen, meer warmte die blijft hangen.' },\n        { n: 'Koolstofbudget', d: `De hoeveelheid CO₂ die wereldwijd nog uitgestoten mag worden om onder een opwarmingsgrens, zoals 1,5 °C, te blijven.`, x: `Als een saldo op je rekening: elke uitstoot haalt er iets vanaf.`, k: 'budget', a: {}, c: 'Het budget is eindig, de thermometer loopt op.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 5', t: 'Meervoudige waardecreatie & dubbele materialiteit', items: [\n        { n: 'Zes kapitalen', s: 'IIRC-model', d: `Een raamwerk waarin organisaties waarde creëren via zes vormen van kapitaal, niet alleen via geld.`, x: `Een bakkerij heeft geld, ovens, recepten, bakkers, klanten én graan nodig.`, k: 'radial', a: KAP(-1), c: 'Zes soorten kapitaal rond één organisatie.' },\n        { n: 'Financieel kapitaal', p: 'Zes kapitalen', d: `Geldmiddelen en financiële activa waarmee een organisatie haar doelen bereikt.`, x: `Spaargeld, leningen en investeringen.`, k: 'radial', a: KAP(0), c: 'Kapitaal 1 van 6.' },\n        { n: 'Geproduceerd kapitaal', p: 'Zes kapitalen', d: `De fysieke middelen die een organisatie gebruikt: gebouwen, machines en infrastructuur.`, x: `Een fabriekshal, een vrachtwagen, een server.`, k: 'radial', a: KAP(1), c: 'Kapitaal 2 van 6.' },\n        { n: 'Intellectueel kapitaal', p: 'Zes kapitalen', d: `Kennis, patenten, merken en systemen die een organisatie onderscheidend maken.`, x: `Een bekend merk of een eigen recept.`, k: 'radial', a: KAP(2), c: 'Kapitaal 3 van 6.' },\n        { n: 'Menselijk kapitaal', p: 'Zes kapitalen', d: `De vaardigheden, kennis en motivatie van medewerkers.`, x: `Een team dat goed is opgeleid en er zin in heeft.`, k: 'radial', a: KAP(3), c: 'Kapitaal 4 van 6.' },\n        { n: 'Sociaal & relationeel kapitaal', p: 'Zes kapitalen', d: `De relaties, het vertrouwen en de samenwerkingsverbanden tussen een organisatie en haar omgeving.`, x: `Goede banden met buurt, klanten en leveranciers.`, k: 'radial', a: KAP(4), c: 'Kapitaal 5 van 6.' },\n        { n: 'Natuurlijk kapitaal', p: 'Zes kapitalen', d: `De natuurlijke hulpbronnen en ecosysteemdiensten waarvan een organisatie gebruikmaakt of afhankelijk is.`, x: `Schoon water, vruchtbare bodem en bestuivende bijen voor een fruitkweker.`, k: 'radial', a: KAP(5), c: 'Kapitaal 6 van 6.' },\n        { n: 'Dubbele materialiteit', d: `Een organisatie rapporteert zowel over haar impact op mens en milieu (inside-out) als over hoe maatschappelijke en ecologische ontwikkelingen háár raken (outside-in).`, x: `Een brouwerij: haar waterverbruik raakt de omgeving én droogte raakt haar productie.`, k: 'materiality', a: { mode: 'both' }, c: 'Twee richtingen, allebei meetellen.' },\n        { n: 'Inside-out', s: 'impactmaterialiteit', p: 'Dubbele materialiteit', d: `De impact die een organisatie zelf veroorzaakt op haar omgeving.`, x: `De uitstoot van een fabriek voor de buurt.`, k: 'materiality', a: { mode: 'out' }, c: 'Van binnen naar buiten.' },\n        { n: 'Outside-in', s: 'financiële materialiteit', p: 'Dubbele materialiteit', d: `Hoe externe ontwikkelingen, zoals klimaatrisico's, de financiële positie van een organisatie beïnvloeden.`, x: `Overstromingen die een magazijn beschadigen.`, k: 'materiality', a: { mode: 'in' }, c: 'Van buiten naar binnen.' },\n        { n: 'Stakeholderbetrokkenheid', d: `Belanghebbenden actief betrekken bij strategische keuzes, zodat besluiten rekening houden met hun belangen en kennis.`, x: `Omwonenden meedenken over de plannen voor een nieuwe fabriek.`, k: 'radial', a: { center: 'Onderneming', items: SH, dots: true, hl: -2 }, c: 'Informatie gaat heen én terug.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 6', t: 'Biomimicry & natuurlijke principes in ontwerp', items: [\n        { n: 'Biomimicry', d: `Oplossingen voor menselijke vraagstukken ontlenen aan strategieën die de natuur al miljoenen jaren test, op het niveau van organisme, gedrag of ecosysteem.`, x: `Een treinneus ontworpen naar de snavel van een ijsvogel.`, k: 'nature', a: { chips: true }, c: 'Leren van de natuur op drie niveaus.' },\n        { n: `Life's Principles`, d: `Een set ontwerpprincipes die is afgeleid van de natuur.`, x: `Vijf ervan: zuinig, aanpasbaar, groei met ontwikkeling, veilige chemie en lokaal afgestemd.`, k: 'radial', a: LIFE(-1), c: 'Vijf van de principes uit de lijst.' },\n        { n: 'Be resource efficient', p: `Life's Principles`, d: `Zo zuinig mogelijk omgaan met materiaal en energie.`, x: `Een bijenraat biedt veel opslagruimte met weinig was.`, k: 'radial', a: LIFE(0), c: 'Principe 1 van 5.' },\n        { n: 'Adapt to changing conditions', p: `Life's Principles`, d: `Flexibel en aanpasbaar zijn wanneer omstandigheden veranderen.`, x: `Planten die hun bladstand aanpassen aan zon en droogte.`, k: 'radial', a: LIFE(1), c: 'Principe 2 van 5.' },\n        { n: 'Integrate development with growth', p: `Life's Principles`, d: `Groei combineren met voortdurende ontwikkeling en verbetering, in plaats van alleen op te schalen.`, x: `Een jong bedrijf dat groeit én steeds slimmer wordt, niet alleen groter.`, k: 'radial', a: LIFE(2), c: 'Principe 3 van 5.' },\n        { n: 'Use life-friendly chemistry', p: `Life's Principles`, d: `Werken met stoffen en processen die veilig zijn voor levende systemen.`, x: `Verf op waterbasis, zonder giftige oplosmiddelen.`, k: 'radial', a: LIFE(3), c: 'Principe 4 van 5.' },\n        { n: 'Be locally attuned and responsive', p: `Life's Principles`, d: `Oplossingen afstemmen op de lokale context en daarop reageren.`, x: `Bouwen met lokale materialen die bij het klimaat passen.`, k: 'radial', a: LIFE(4), c: 'Principe 5 van 5.' },\n        { n: 'Duurzaam design', d: `Ontwerpen die schade aan mens en milieu zo veel mogelijk beperken.`, x: `Een product dat minder energie en minder grondstof kost.`, k: 'trend', a: { mode: 'dur' }, c: 'Minder schade, maar nog geen herstel.' },\n        { n: 'Regeneratief design', d: `Ontwerpen die verder gaan dan schade beperken: ze herstellen en versterken actief de ecologische of sociale systemen waarin ze functioneren.`, x: `Een landbouwmethode die de bodem na elk seizoen vruchtbaarder maakt.`, k: 'trend', a: { mode: 'reg' }, c: 'Niet minder slecht, maar actief beter.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 7', t: 'Wicked problems & systeemdenken', items: [\n        { n: 'Wicked problem', d: `Een complex maatschappelijk probleem dat je niet eenduidig kunt definiëren of oplossen. Oplossingen zijn niet waar of onwaar, maar beter of slechter.`, x: `Klimaatverandering of armoede: elke ingreep verandert het probleem zelf.`, k: 'radial', a: { center: 'Wicked|problem', hl: -1, step: 2.2, items: ['Probleem niet|vast te leggen', 'Geen definitieve|oplossing', 'Beter of slechter,|niet waar of onwaar', 'Elke ingreep|verandert het probleem', 'Elke situatie|is uniek'] }, c: 'Vijf kenmerken van een wicked problem.' },\n        { n: 'Holistisch kijken', d: `Een vraagstuk als geheel bekijken, inclusief de onderlinge relaties tussen onderdelen, in plaats van het op te splitsen in losse stukken.`, x: `Het voedselsysteem bekijken van boer tot bord, niet alleen de supermarkt.`, k: 'network', a: { ring: 'het geheel' }, c: 'Eerst het geheel, dan pas de details.' },\n        { n: 'Feedbackloop', d: `Een terugkoppeling waarbij een gevolg op zijn beurt de oorzaak beïnvloedt (zie ook positieve en negatieve feedback bij les 2).`, x: `Meer verkeer leidt tot meer wegen, en dat leidt weer tot meer verkeer.`, k: 'loop', a: { mode: 'plain', labels: ['Meer verkeer', 'Meer wegen', 'Minder files', 'Meer autorijden'], signs: null }, c: 'Het gevolg wordt zelf weer oorzaak.' },\n        { n: 'Hefboompunt', s: 'interventiepunt', d: `Een plek in het systeem waar een relatief kleine ingreep een relatief grote verandering in het hele systeem kan veroorzaken.`, x: `Het openbaar vervoer goedkoper maken verandert het reisgedrag van veel mensen tegelijk.`, k: 'lever', a: {}, c: 'Kleine kracht op de juiste plek, groot effect.' },\n        { n: 'Causal Loop Diagram (CLD)', d: `Een visuele techniek om oorzaak-gevolgrelaties en feedbackloops in een systeem in kaart te brengen, zodat je hefboompunten kunt vinden.`, x: `Pijlen met plus- of mintekens laten zien of iets versterkt of afremt.`, k: 'loop', a: { mode: 'cld', labels: ['Aantal vissen', 'Vangst', 'Inkomen', 'Meer schepen'], signs: ['+', '+', '+', '-'] }, c: 'Plus: zelfde richting. Min: tegengestelde richting.' },\n        { n: 'Lock-in effect', d: `Een systeem zit vast aan een bepaalde technologie, gewoonte of structuur, waardoor overstappen naar een beter alternatief moeilijk wordt.`, x: `Het QWERTY-toetsenbord: iedereen kent het, dus niemand stapt over.`, k: 'tipping', a: { mode: 'lock' }, c: 'Het alternatief is beter, maar de drempel is te hoog.' },\n        { n: 'Padafhankelijkheid', d: `Eerdere keuzes beperken de ruimte voor toekomstige keuzes, waardoor een systeem op een soms onduurzaam pad blijft, ook als er betere alternatieven zijn.`, x: `Een stad die rond de auto is gebouwd, stapt niet zomaar over op fiets en ov.`, k: 'path', a: {}, c: 'Elke keuze sluit andere wegen af.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 8', t: 'Casuïstiek & strategische besluitvorming', items: [\n        { n: 'Systeemkaart', d: `Een visuele weergave van actoren, relaties en invloeden binnen een vraagstuk, zodat je de situatie overziet voordat je naar oplossingen zoekt.`, x: `Een kaart met boeren, gemeente, supermarkt en consument rond voedselverspilling.`, k: 'network', a: { labels: ['Vraagstuk', 'Overheid', 'Bedrijven', 'Burgers', 'Natuur', 'Kennis', 'Geld'] }, c: 'Eerst alle spelers en hun verbanden zien.' },\n        { n: 'Stakeholderidentificatie', d: `Systematisch in kaart brengen welke partijen belang hebben bij, of invloed hebben op, een vraagstuk.`, x: `Wie wonen, werken of beslissen er rondom dit project?`, k: 'radial', a: { center: 'Vraagstuk', items: SH, slow: true, scan: true, hl: -2 }, c: 'Zoeken wie er allemaal bij hoort.' },\n        { n: 'Belangenanalyse', d: `Beoordelen wat de belangen, de macht en de positie van stakeholders zijn, ten opzichte van elkaar en van het vraagstuk.`, x: `Wie heeft veel macht én veel belang? Die partij betrek je het eerst.`, k: 'matrix', a: {}, c: 'Macht en belang naast elkaar gezet.' },\n        { n: 'Context mapping', d: `De bredere omgeving van een vraagstuk in kaart brengen (sociaal, economisch, ecologisch, technologisch) voordat je een oplossing ontwerpt.`, x: `Eerst begrijpen in welk speelveld je ingrijpt, daarna pas ontwerpen.`, k: 'radial', a: { center: 'Vraagstuk', hl: -1, step: 1.8, items: ['Sociaal', 'Economisch', 'Ecologisch', 'Technologisch'] }, c: 'Vier lagen om het vraagstuk heen.' }\n      ]\n    });\n    CH.push({\n      el: 1, id: 'Les 9', t: 'Synthese & toets', items: [\n        { n: 'Strategische trade-off analyse', d: `Meerdere oplossingsrichtingen systematisch afwegen. Elke keuze heeft eigen voor- en nadelen, afhankelijk van waarden en systeemdynamiek.`, x: `Goedkoper nu versus duurzamer later: wat weegt voor wie zwaarder?`, k: 'scale', a: { mode: 'trade' }, c: 'Afwegen tot er een bewuste keuze ligt.' },\n        { n: 'Circulaire strategie hoog op de R-ladder', d: `Een strategie die kiest voor niet-produceren, herontwerpen of radicaal minder consumeren, in plaats van pas bij afdanking in te grijpen.`, x: `Een product helemaal niet maken is circulairder dan het perfect recyclen.`, k: 'ladder', a: ladder([0, 2]), c: 'Hoog op de ladder: ingrijpen vóór afdanking.' }\n      ]\n    });\n    CH.push({\n      el: 2, id: 'Module 1', t: 'Economie & systemen', items: [\n        { n: 'Morele economie', d: `Economische systemen zijn nooit waardevrij: elke keuze over verdeling, toegang en bescherming is uiteindelijk een morele keuze.`, x: `Wie krijgt toegang tot schoon water, en tegen welke prijs?`, k: 'radial', a: { center: 'Economie', hl: -1, step: 1.8, items: ['Verdeling', 'Toegang', 'Bescherming'] }, c: 'Achter elk systeem zitten keuzes.' },\n        { n: 'Rechtvaardige verdeling', d: `Wie krijgt wat, wanneer en waarom? Dat wordt expliciet of impliciet bepaald door de inrichting van een systeem.`, x: `Hoe worden schaarse woningen verdeeld: op prijs, wachttijd of loting?`, k: 'scale', a: { mode: 'fair' }, c: 'Verdeling is een keuze, geen natuurwet.' },\n        { n: 'Begrenzing', d: `Elk systeem (ecologisch, sociaal, fysiek) heeft grenzen die bepalen hoeveel er beschikbaar is en wie er toegang toe heeft.`, x: `Een grondwaterbron kan maar zoveel leveren.`, k: 'boundary', a: { mode: 'limit' }, c: 'Ook als de vraag stijgt, blijft de grens staan.' },\n        { n: 'Commons', d: `Gedeelde hulpbronnen, zoals schone lucht, water of digitale infrastructuur, die niemand bezit en die zonder afspraken achteruitgaan (tragedy of the commons).`, x: `Een gemeenschappelijke weide waar iedereen te veel koeien op zet.`, k: 'commons', a: {}, c: 'Zonder afspraken raakt de bron op.' },\n        { n: 'Externaliteiten', d: `Kosten of schade van een handeling die niet de veroorzaker draagt, maar andere mensen of de samenleving.`, x: `Een fabriek stoot uit; de buurt betaalt met haar gezondheid.`, k: 'extern', a: {}, c: 'De winst blijft, de kosten verhuizen.' },\n        { n: 'Systeemlogica', d: `Systemen (markten, bedrijven, algoritmes) volgen als een machine hun eigen ontwerpdoel en houden niet vanzelf rekening met morele waarden, tenzij die bewust zijn ingebouwd.`, x: `Een algoritme dat alleen op klikken stuurt, let niet op waarheid.`, k: 'gears', a: {}, c: 'De machine volgt haar doel, niet jouw waarden.' }\n      ]\n    });\n    CH.push({\n      el: 2, id: 'Module 2', t: 'Psychologie & systemen', items: [\n        { n: 'Kuddegedrag', d: `Uit onzekerheid het gedrag van de groep volgen, wat kan leiden tot tunnelvisie, instabiliteit of zeepbellen.`, x: `Iedereen koopt hetzelfde aandeel, omdat iedereen het koopt.`, k: 'herd', a: {}, c: 'Onzeker? Dan volgt de groep de voorloper.' },\n        { n: 'Verliesaversie', d: `De pijn van verlies weegt zwaarder dan het plezier van een even grote winst, wat tot voorzichtig of irrationeel risicogedrag leidt.`, x: `Je baalt meer van €50 verliezen dan dat je blij bent met €50 winst.`, k: 'scale', a: { mode: 'loss' }, c: 'Even groot, maar verlies voelt zwaarder.' },\n        { n: 'Morele ontkoppeling', d: `Jezelf ervan overtuigen dat morele normen in deze situatie even niet gelden, zodat schadelijk gedrag te rechtvaardigen wordt.`, x: `\"Iedereen doet het\", dus het is niet zo erg.`, k: 'radial', a: MECH(-1), c: 'Vier veelgebruikte mechanismen.' },\n        { n: 'Herdefiniëren van gedrag', p: 'Morele ontkoppeling', d: `Een schadelijke handeling een neutrale of positieve naam geven, waardoor de morele lading verdwijnt.`, x: `Ontslagen heten \"strategisch noodzakelijk\".`, k: 'radial', a: MECH(0), c: 'Mechanisme 1 van 4.' },\n        { n: 'Minimaliseren van gevolgen', p: 'Morele ontkoppeling', d: `De werkelijke schade kleiner voorstellen dan ze is.`, x: `\"Een beetje extra uitstoot maakt toch niets uit.\"`, k: 'radial', a: MECH(1), c: 'Mechanisme 2 van 4.' },\n        { n: 'Verschuiven van verantwoordelijkheid', p: 'Morele ontkoppeling', d: `In een groot systeem voelt niemand zich verantwoordelijk, omdat iedereen maar een klein deel van het geheel uitvoerde.`, x: `\"Ik deed alleen wat de afdeling vroeg.\"`, k: 'radial', a: MECH(2), c: 'Mechanisme 3 van 4.' },\n        { n: 'Normalisatie van afwijkend gedrag', p: 'Morele ontkoppeling', d: `Een praktijk bestaat al zo lang dat niemand haar nog als problematisch ervaart.`, x: `\"Zo doen we dat hier altijd al.\"`, k: 'radial', a: MECH(3), c: 'Mechanisme 4 van 4.' },\n        { n: 'Agency', d: `De mate waarin je als individu binnen een systeem dat sterker is dan jijzelf, nog eigen keuzes en invloed hebt.`, x: `Een medewerker die binnen de regels toch een duurzamere leverancier kiest.`, k: 'agency', a: {}, c: 'Het systeem duwt, jouw keuze buigt de uitkomst.' }\n      ]\n    });\n    CH.push({\n      el: 2, id: 'Module 3', t: 'Organisaties & macht', items: [\n        { n: 'Financialisering', d: `Financiële markten en indicatoren worden steeds bepalender voor de strategische keuzes en de tijdshorizon van ondernemingen.`, x: `Beslissingen worden gestuurd door kwartaalcijfers in plaats van langetermijnimpact.`, k: 'compete', a: { l1: 'Financiële indicatoren', l2: 'Lange termijn & maatschappij' }, c: 'Het financiële gewicht groeit, de horizon krimpt.' },\n        { n: 'Kapitaal als selectiemechanisme', d: `De stroom van investeringen bepaalt welke activiteiten toegang krijgen tot groei, innovatie en schaal, en welke niet.`, x: `Een veelbelovend maar niet-rendabel project krijgt geen financiering.`, k: 'funnel', a: { top: 'Alle activiteiten', pass: 'krijgt kapitaal, groeit', grow: true }, c: 'Alleen wat past, krijgt de ruimte om te groeien.' },\n        { n: 'Aandeelhoudersmodel', d: `Een organisatiemodel waarin zeggenschap vooral wordt gelegitimeerd door wie kapitaal en financieel risico inbrengt.`, x: `De aandeelhoudersvergadering beslist over de koers van het bedrijf.`, k: 'radial', a: { center: 'Onderneming', items: ['Aandeelhouders', 'Werknemers', 'Leveranciers', 'Gemeenschap'], hl: 0, dim: true }, c: 'Eén partij weegt het zwaarst.' },\n        { n: 'Stakeholdersmodel', s: 'stakeholderbenadering', d: `De onderneming als samenwerkingsverband van onderling afhankelijke partijen (werknemers, leveranciers, gemeenschap), die elk een eigen investering en risico dragen.`, x: `Ook medewerkers en buurt krijgen inspraak, want zij investeren en lopen risico.`, k: 'radial', a: { center: 'Onderneming', items: ['Aandeelhouders', 'Werknemers', 'Leveranciers', 'Gemeenschap'], hl: -2, ring: true, dots: true }, c: 'Iedereen is met iedereen verbonden.' },\n        { n: 'Beslissingspremissen', d: `Vooraf vastgestelde doelen, indicatoren en interpretatiekaders die bepalen welke keuzeopties überhaupt zichtbaar worden in een besluitvormingsproces.`, x: `Wie alleen op winst stuurt, ziet duurzame opties niet eens op tafel.`, k: 'funnel', a: { top: 'Mogelijke keuzes', pass: 'wat zichtbaar wordt' }, c: 'De trechter bepaalt wat er nog overblijft.' },\n        { n: 'Marktconcentratie', d: `Een klein aantal ondernemingen beheerst een groot deel van een markt, vaak versterkt door schaalvoordelen en netwerkeffecten.`, x: `Een handvol platforms bepaalt wat je online ziet en koopt.`, k: 'concentr', a: {}, c: 'Van gelijke spelers naar een paar reuzen.' }\n      ]\n    });\n    CH.push({\n      el: 2, id: 'Module 4', t: 'Technologie, macht & morele interventie', items: [\n        { n: 'Technologie is niet neutraal', d: `Elke technologie draagt waarden, aannames en machtsverhoudingen in zich, via de keuzes die bij het ontwerp zijn gemaakt.`, x: `Een sollicitatiealgoritme dat op oude data is getraind, neemt oude vooroordelen over.`, k: 'radial', a: { center: 'Technologie', hl: -1, step: 1.8, items: ['Waarden', 'Aannames', 'Machtsverhoudingen'] }, c: 'In elk ontwerp zitten keuzes verstopt.' },\n        { n: 'Ontwerpinterventie', d: `Een ingreep op het niveau van het ontwerp zelf.`, x: `Transparantie inbouwen in een algoritme, zodat gebruikers een beslissing kunnen begrijpen.`, k: 'rings', a: lev(0), c: 'Niveau 1: het product zelf.' },\n        { n: 'Organisatorische interventie', d: `Een ingreep op het niveau van de organisatie.`, x: `Een ethische commissie die technologieprojecten vooraf toetst.`, k: 'rings', a: lev(1), c: 'Niveau 2: de organisatie eromheen.' },\n        { n: 'Institutionele interventie', d: `Een ingreep op het niveau van wet- en regelgeving.`, x: `De Europese AI Act, die strengere eisen stelt aan hoogrisicotoepassingen.`, k: 'rings', a: lev(2), c: 'Niveau 3: de regels van de samenleving.' },\n        { n: 'Datamacht', d: `De machtspositie die ontstaat wanneer een partij grootschalig data verzamelt en controleert, en daarmee invloed krijgt op anderen.`, x: `Een platform dat weet wat je leuk vindt, kan je keuzes sturen.`, k: 'hub', a: {}, c: 'Hoe meer data, hoe groter de invloed.' }\n      ]\n    });\n    CH.push({\n      el: 2, id: 'Module 5', t: 'Greenwashing', items: [\n        { n: 'Greenwashing', d: `Een groen of duurzaam imago creëren zonder dat daar een echte verandering in het bedrijfsmodel of de werkelijke impact tegenover staat (Delmas & Burbano, 2011).`, x: `Een groen label op de verpakking, terwijl het productieproces gelijk blijft.`, k: 'greenwash', a: { mode: 'gen' }, c: 'Een nieuw label, dezelfde fabriek.' },\n        { n: 'Selectieve communicatie', p: 'Greenwashing', d: `Eén duurzaam initiatief breed uitlichten, terwijl activiteiten met een veel grotere negatieve impact buiten beeld blijven.`, x: `Reclame voor één zonnepaneeldak, en niets over de vervuilende fabriek.`, k: 'greenwash', a: { mode: 'select' }, c: 'Het licht valt op het kleine, groene stukje.' },\n        { n: 'Vage of niet-verifieerbare claims', p: 'Greenwashing', d: `Woorden als \"groen\" of \"natuurlijk\" gebruiken zonder definitie of meetbaar criterium.`, x: `\"100% natuurlijk\" op een pak, zonder te zeggen waar dat op slaat.`, k: 'greenwash', a: { mode: 'vague' }, c: 'Een claim die je niet kunt controleren.' },\n        { n: 'Irrelevante communicatie', p: 'Greenwashing', d: `Een claim die feitelijk klopt, maar in de praktijk niets toevoegt.`, x: `\"CFK-vrij\" voor een stof die al jaren wettelijk verboden is.`, k: 'greenwash', a: { mode: 'irrelevant' }, c: 'Waar, maar zonder betekenis.' },\n        { n: 'Symbolische duurzaamheid', p: 'Greenwashing', d: `Een klein initiatief met nauwelijks effect op de totale impact, dat in de communicatie disproportioneel wordt uitvergroot.`, x: `Een grote campagne voor een paar plastic rietjes minder.`, k: 'greenwash', a: { mode: 'symbol' }, c: 'In de communicatie groot, in werkelijkheid klein.' }\n      ]\n    });\n\n    /* ---------- scenes opbouwen ---------- */\n    const EL = { 1: { k: 'E-learning 1', t: 'Duurzaamheid, circulariteit en systeemdenken' }, 2: { k: 'E-learning 2', t: 'Business Ethics' } };\n    const wc = (s) => (s || '').split(/\\s+/).filter(Boolean).length;\n    const scenes = [], chFirst = [], chLast = [];\n    let termNo = 0;\n    scenes.push({ type: 'intro', dur: 14 });\n    CH.forEach((c, ci) => {\n      chFirst[ci] = scenes.length;\n      scenes.push({ type: 'chapter', ci, dur: cl(2.8 + c.items.length * 0.3 + 2, 5.5, 12) });\n      c.items.forEach((it) => {\n        termNo++;\n        const w = wc(it.d) + wc(it.x);\n        scenes.push({ type: 'term', ci, no: termNo, it, dur: cl(3.2 + w / 3.4, 8, 20) });\n      });\n      chLast[ci] = scenes.length - 1;\n    });\n    scenes.push({ type: 'outro', dur: 8 });\n\n    const E = { C, f, cl, rp, R, eo, eio, lerp, mk, K, CH, EL, scenes, chFirst, chLast, total: termNo, wc };\n    Ctor._E = E;\n    return E;\n  }\n\n  renderVals() {\n    const E = this._engine();\n    const { f, cl, rp, R } = E;\n    const s = this.state || {};\n    const idx = Math.min(s.idx || 0, E.scenes.length - 1);\n    const sc = E.scenes[idx];\n    const t = s.t || 0;\n    const speed = s.speed || 1;\n    const playing = !!s.playing;\n    const vis = (a, b) => { const u = R(t, a, b); return `opacity:${f(u)};transform:translateY(${f((1 - u) * 10)}px);`; };\n\n    const o = E.mk();\n    const v = {\n      isIntro: sc.type === 'intro', isChapter: sc.type === 'chapter', isTerm: sc.type === 'term', isOutro: sc.type === 'outro',\n      showIll: sc.type === 'intro' || sc.type === 'term',\n      chapterLabel: '', cap: '', rvCap: 'opacity:0;',\n      isPlaying: playing, notPlaying: !playing, playLabel: playing ? 'Pauzeren' : 'Afspelen',\n      counter: '', scenePct: f(100 * cl(t / sc.dur))\n    };\n    const isWeb = s.tab === 'web', isToets = s.tab === 'toets';\n    v.isWeb = isWeb; v.isToets = isToets; v.isAnim = !isWeb && !isToets;\n    const ON = 'border:0;background:#5C7A5A;color:#fff;', OFF = 'border:1px solid #E4DDD6;background:#fff;color:#1C1713;';\n    v.tabAnimCss = v.isAnim ? ON : OFF;\n    v.tabWebCss = isWeb ? ON : OFF;\n    v.tabToetsCss = isToets ? ON : OFF;\n    v.onTabAnim = () => this.setState({ tab: 'anim' });\n    v.onTabWeb = () => this.setState({ tab: 'web', playing: false });\n    v.onTabToets = () => this.setState({ tab: 'toets', playing: false });\n    v.tCases = []; v.tSegs = []; v.tRows = []; v.tEnts = []; v.tBtns = [];\n    v.tIdle = false; v.tSel = false; v.tHasQ = false; v.tTitle = ''; v.tKick = ''; v.tHead = ''; v.tIntro = ''; v.tSelKick = ''; v.tQuote = ''; v.tQ = ''; v.tA = '';\n    v.onTOverview = () => {};\n    v.hasLink = false; v.linkLabel = ''; v.onLink = () => {};\n    v.wLines = []; v.wNodes = []; v.wIdle = false; v.wNode = false; v.wStory = false; v.hasCard = false; v.wBtns = [];\n    v.wq = ''; v.wHasQ = false; v.wSearching = false; v.wNone = false; v.wRes = []; v.wResKick = ''; v.onWQ = () => {}; v.onWKey = () => {}; v.onWClear = () => {};\n    v.wLegend = []; v.wStories = []; v.wHubs = []; v.nRows = []; v.sPath = []; v.onOverview = () => {};\n    {\n      const vw = s.vw > 0 ? s.vw : 1280, vh = s.vh > 0 ? s.vh : 720;\n      const k = Math.max(0.2, Math.min(vw / 1280, vh / 720));\n      const ox = Math.max(0, (vw - 1280 * k) / 2), oy = Math.max(0, (vh - 720 * k) / 2);\n      v.fitCss = `left:${f(ox)}px;top:${f(oy)}px;transform:scale(${Math.round(k * 1000) / 1000});transform-origin:0 0;`;\n    }\n\n    if (sc.type === 'intro') {\n      const n1 = E.CH.filter((c) => c.el === 1).reduce((a, c) => a + c.items.length, 0);\n      const n2 = E.total - n1;\n      const l1 = E.CH.filter((c) => c.el === 1).length, l2 = E.CH.filter((c) => c.el === 2).length;\n      v.introLine = `${E.total} begrippen uit twee e-learnings, elk met een korte uitleg, een voorbeeld en een animatie.`;\n      v.elCards = [\n        { k: E.EL[1].k, t: `${E.EL[1].t} · ${l1} lessen · ${n1} begrippen` },\n        { k: E.EL[2].k, t: `${E.EL[2].t} · ${l2} modules · ${n2} begrippen` }\n      ];\n      try { E.K.network(o, t, { labels: ['Systeem', 'Circulair', 'Feedback', 'Kapitaal', 'Macht', 'Ethiek', 'Natuur'], ring: 'begrippen verbonden' }); } catch (e) {}\n      v.cap = 'Honderd losse begrippen vormen samen één verhaal.';\n      v.rvCap = vis(1.5, 2.2);\n      v.cap = `${E.total} begrippen, één verhaal.`;\n    } else if (sc.type === 'chapter') {\n      const c = E.CH[sc.ci];\n      const parts = c.id.split(' ');\n      v.chapterLabel = `${E.EL[c.el].k} · ${c.id}`;\n      v.chKicker = `${E.EL[c.el].k} · ${E.EL[c.el].t}`;\n      v.chNo = parts[1];\n      v.chTitle = `${parts[0] === 'Les' ? 'Les' : 'Module'} ${parts[1]}: ${c.t}`;\n      v.chCount = `${c.items.length} ${c.items.length === 1 ? 'begrip' : 'begrippen'}`;\n      v.rvA = vis(0.1, 0.8);\n      v.chips = c.items.map((it, i) => ({ label: it.n, css: vis(0.9 + 0.25 * i, 1.4 + 0.25 * i) }));\n      v.counter = '';\n    } else if (sc.type === 'term') {\n      const it = sc.it, c = E.CH[sc.ci];\n      const parts = c.id.split(' ');\n      v.chapterLabel = `${E.EL[c.el].k} · ${c.id}`;\n      v.lesLabel = `${c.id} · ${c.t}`;\n      v.termName = it.n; v.termSub = it.s || ''; v.hasSub = !!it.s;\n      v.parentName = it.p || ''; v.hasParent = !!it.p;\n      v.termFs = it.n.length <= 22 ? 60 : it.n.length <= 30 ? 48 : it.n.length <= 40 ? 40 : 34;\n      v.defText = it.d; v.exText = it.x;\n      const dw = E.wc(it.d);\n      const exT = Math.min(1.0 + dw / 4.0, sc.dur * 0.55);\n      v.rvLes = vis(0, 0.5); v.rvParent = vis(0.2, 0.7); v.rvTerm = vis(0.15, 0.7); v.rvDef = vis(0.8, 1.4); v.rvEx = vis(exT, exT + 0.6);\n      v.cap = it.c || ''; v.rvCap = vis(1.4, 2.0);\n      try { E.K[it.k](o, t, it.a || {}); } catch (e) {}\n      v.counter = `Begrip ${sc.no} van ${E.total}`;\n    } else {\n      v.chapterLabel = '';\n      v.outroLine = `${E.total} begrippen uit twee e-learnings gehad.`;\n    }\n    v.ill = o.a;\n    if (sc.type === 'term') {\n      const nn = this._web().nodes[sc.no];\n      if (nn && nn.adj.length) { v.hasLink = true; v.linkLabel = `Bekijk ${nn.adj.length} ${nn.adj.length === 1 ? 'verband' : 'verbanden'} →`; v.onLink = () => this.setState({ tab: 'web', playing: false, sel: sc.no, selE: nn.adj[0], story: -1, step: 0 }); }\n    }\n    if (isWeb) { v.chapterLabel = 'Verbanden tussen begrippen'; this._webVals(v, s); }\n    if (isToets) { v.chapterLabel = 'Toets · donderdag 29 oktober'; this._toetsVals(v, s); }\n\n    v.segs = E.CH.map((c, j) => {\n      const a = E.chFirst[j], b = E.chLast[j], n = b - a + 1;\n      const inside = idx >= a && idx <= b;\n      const fill = idx > b ? 100 : inside ? 100 * ((idx - a) + cl(t / sc.dur)) / n : 0;\n      const parts = c.id.split(' ');\n      const gap = (j > 0 && c.el !== E.CH[j - 1].el) ? 'margin-left:14px;' : '';\n      return {\n        label: parts[0][0] + parts[1], aria: c.id + ': ' + c.t, fill: f(fill),\n        css: (inside ? 'border:2px solid #5C7A5A;' : 'border:1px solid #E4DDD6;') + gap,\n        go: () => this._jump(a)\n      };\n    });\n\n    v.speeds = [1, 1.5, 2].map((x) => ({\n      label: x + '×', aria: 'Snelheid ' + x + ' keer',\n      css: speed === x ? 'border:0;background:#5C7A5A;color:#fff;' : 'border:1px solid #E4DDD6;background:#fff;color:#1C1713;',\n      go: () => this.setState({ speed: x })\n    }));\n\n    v.onStart = () => this.setState({ idx: 1, t: 0, playing: true });\n    v.onRestart = () => this.setState({ idx: 1, t: 0, playing: true });\n    v.onToggle = () => {\n      const st = this.state || {};\n      const i = st.idx || 0;\n      if (st.playing) { this.setState({ playing: false }); return; }\n      if (i === 0) { this.setState({ idx: 1, t: 0, playing: true }); return; }\n      if (i >= E.scenes.length - 1) { this.setState({ idx: 1, t: 0, playing: true }); return; }\n      this.setState({ playing: true });\n    };\n    v.onNext = () => this._jump((this.state.idx || 0) + 1);\n    v.onPrev = () => this._jump((this.state.idx || 0) - 1);\n    v.onNextCh = () => {\n      const i = this.state.idx || 0;\n      const nxt = E.chFirst.find((a) => a > i);\n      this._jump(nxt === undefined ? E.scenes.length - 1 : nxt);\n    };\n    v.onPrevCh = () => {\n      const i = this.state.idx || 0;\n      let cur = 0;\n      E.chFirst.forEach((a, j) => { if (a <= i) cur = j; });\n      const here = E.chFirst[cur];\n      this._jump(i > here + 1 ? here : (cur > 0 ? E.chFirst[cur - 1] : 0));\n    };\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
